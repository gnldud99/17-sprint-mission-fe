<!doctype html>
<html>
  <head>
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <a href="/" class="logo">
        <img src="images/logo.png" alt="판다마켓" />
        <span>판다마켓</span>
      </a>

      <a href="login/index.html" class="login">로그인</a>
    </header>

    <main class="hero">
      <div class="hero-text">
        <div>
          <h1>일상의 모든 물건을<br />거래해 보세요</h1>

          <a href="items/index.html" class="go-items">구경하러 가기</a>
        </div>

        <img src="images/panda.png" alt="판다" />
      </div>
    </main>

    <section class="hot-item">
      <div class="hot-item-inner">
        <img src="images/item1.png" alt="인기 상품" />

        <div class="hot-item-text">
          <p>HOT ITEM</p>
          <h2>인기 상품을<br />확인해보세요</h2>
          <span>가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</span>
        </div>
      </div>
    </section>

    <section class="search-item">
      <div class="search-item-inner">
        <div class="search-item-text">
          <p>구매를 원하는<br />상품을 검색하세요</p>
          <span>구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</span>
        </div>

        <img src="images/item2.png" alt="상품 검색" />
      </div>
    </section>
    <section class="register-item">
      <div class="register-item-inner">
        <img src="images/item3.png" alt="상품 등록" />

        <div class="register-item-text">
          <p class="register-title">Register</p>

          <h2>
            판매를 원하는<br />
            상품을 등록하세요
          </h2>

          <span>
            어떤 물건이든 판매하고 싶은 상품을<br />
            쉽게 등록하세요
          </span>
        </div>
      </div>
    </section>

    <section class="trust-item">
      <div class="trust-item-inner">
        <div class="trust-item-text">
          <h2>
            믿을 수 있는<br />
            판다마켓 중고 거래
          </h2>
        </div>

        <img src="images/item4.png" alt="판다마켓 중고 거래" />
      </div>
    </section>

    <footer class="footer">
      <div class="footer-inner">
        <p>@codeit-2024</p>

        <div class="footer-links">
          <a href="privacy/index.html"">Privacy Policy</a>
          <a href="FAQ/index.html">FAQ</a>
        </div>

        <div class="footer-social">
          <a href="https://www.facebook.com" target="_blank">
            <img src="images/facebook.png" alt="페이스북" />
          </a>

          <a href="https://x.com/" target="_blank">
            <img src="images/twitter.png" alt="트위터" />
          </a>

          <a href="https://www.youtube.com/" target="_blank">
            <img src="images/youtube.png" alt="유튜브" />
          </a>

          <a href="https://www.instagram.com/" target="_blank">
            <img src="images/instagram.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
    <script type="module" src="./main.js"></script>
  </body>
</html>
